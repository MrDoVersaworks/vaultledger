name: VaultLedger CI

on:
  push:
    branches: [ main, audit-remediation ]
  pull_request:
    branches: [ main ]

jobs:
  backend-audit:
    name: Backend — Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'
      - run: npm install
      - name: Type Check
        run: npx tsc --noEmit
      - name: Unit Tests
        run: npm test
        env:
          JWT_SECRET: ci_secret_key_for_testing_purposes_only_32bytes
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_db

  frontend-audit:
    name: Frontend — Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - run: npm install
      - name: Type Check
        run: npx tsc --noEmit --skipLibCheck
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000


  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vaultledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d vaultledger_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            ./backend/package-lock.json
            ./frontend/package-lock.json
      - name: Install backend
        working-directory: ./backend
        run: npm install
      - name: Install frontend
        working-directory: ./frontend
        run: npm install
      - name: Run database migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vaultledger_test
          JWT_ACCESS_SECRET: test_access_secret
          JWT_REFRESH_SECRET: test_refresh_secret
          AES_ENCRYPTION_KEY: test_encryption_key_32bytes_long
          NODE_ENV: test
          CORS_ORIGIN: http://localhost:3002
        run: npm run db:migrate
      - name: Install Playwright browser
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E suite
        working-directory: ./frontend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vaultledger_test
          JWT_ACCESS_SECRET: test_access_secret
          JWT_REFRESH_SECRET: test_refresh_secret
          AES_ENCRYPTION_KEY: test_encryption_key_32bytes_long
          NODE_ENV: test
          CORS_ORIGIN: http://localhost:3002
          NEXT_PUBLIC_API_URL: http://localhost:5002
        run: npx playwright test
