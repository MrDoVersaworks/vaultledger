name: VaultLedger CI

on:
  push:
    branches: [main, audit-remediation]
  pull_request:
    branches: [main]

jobs:
  backend-audit:
    name: Backend — Type Check, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ./backend/package-lock.json
      - run: npm install
      - name: Type Check
        run: npx tsc --noEmit
      - name: Unit Tests
        run: npm test
      - name: Build
        run: npm run build

  frontend-audit:
    name: Frontend — Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json
      - run: npm install
      - name: Type Check
        run: npx tsc --noEmit --skipLibCheck
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5002
      - name: Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5002

  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vaultledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vaultledger_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vaultledger_test
      JWT_ACCESS_SECRET: ci_access_secret_32_chars_minimum
      JWT_REFRESH_SECRET: ci_refresh_secret_32_chars_minimum
      AES_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ADMIN_EMAIL: admin@example.com
      PORT: 5002
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:3002
      NEXT_PUBLIC_API_URL: http://localhost:5002
      NEXT_PUBLIC_BACKEND_URL: http://localhost:5002
      E2E_ADMIN_EMAIL: admin@example.com
      E2E_ADMIN_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            ./backend/package-lock.json
            ./frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install
      - name: Run database migrations
        working-directory: ./backend
        run: npm run db:migrate
      - name: Seed E2E administrator
        working-directory: ./backend
        run: npm run db:seed:e2e
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install
      - name: Install Playwright browser
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E suite
        working-directory: ./frontend
        run: npx playwright test
